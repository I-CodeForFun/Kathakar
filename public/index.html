<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Kathakaar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/theme.css"><meta name="theme-color" content="#faf9f5">
</head><body>
<div id="scrim"></div><div id="shell"><aside id="sb"><div class="sbh"><span>📖</span><b>Kathakaar</b><button class="x" data-a="sbt" title="Collapse menu" id="sbt">«</button></div>
<nav id="nav"></nav>
<div class="gl">Library</div>
<button class="si" data-nw title="New story — start a blank story (asks what to do with the current one)"><i>＋</i><span>New story</span></button>
<button class="si" data-a="lib" title="Kathākośa — all your stories: open, duplicate, share"><i>📚</i><span>Kathākośa</span></button>
<button class="si" data-a="md" title="Story Markdown — this story as a Markdown document"><i>📜</i><span>Story Markdown</span></button>
<div class="gl">Data</div>
<button class="si" data-a="exp" title="Export JSON"><i>⬇️</i><span>Export</span></button>
<button class="si" data-a="imp" title="Import JSON"><i>⬆️</i><span>Import</span></button>
<button class="si" data-a="cs" title="Auto-save to a file (use a Dropbox/OneDrive/iCloud folder to sync)"><i>☁</i><span>Sync</span></button>
<button class="si" data-a="rb" title="Restore last automatic backup"><i>🕘</i><span>Backup</span></button>
<button class="si" data-a="rst" title="Clear and start a blank story"><i>♻️</i><span>Reset</span></button>
</aside><div id="cw"><header><button data-a="sbt" id="hb" title="Menu">☰</button><input id="ttl" placeholder="Story title…" style="flex:1;max-width:340px;font-weight:600"><span class="sp"></span>
<input id="q" placeholder="🔍 Search ( / )" style="width:150px"><button data-a="undo" title="Undo (Ctrl+Z)">↶</button><button data-a="redo" title="Redo (Ctrl+Y)">↷</button><button data-a="th" title="Theme">🌓</button></header>
<main id="app"></main></div></div><aside id="dr"></aside><input type="file" id="fi" accept=".json,application/json" hidden>
<link rel="manifest" href="manifest.webmanifest"><script src="js/keys.js"></script><script src="js/boot.js"></script>
</body></html>
